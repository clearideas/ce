name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm run check:ce-release
      - run: npx --yes npm@11.14.1 ci
      - run: npm run type-check:core
      - run: npm run type-check:ce
      - run: npm run check:import-boundaries
      - run: npm run validate:ce-routes
      - run: npm run check:ce-hygiene
      - run: npm run check:ce-ui
      - run: npm run type-check:ce:web
      - run: npm run lint:ce
      - run: npm run lint:ce:styles
      - run: npm run format:ce:check
      - run: npm run test:ce:unit
      - run: npm run test:ce:api
      # Web suite with coverage: fails below the thresholds in vitest.web.config.ts (plan item 4.4).
      - run: npm run test:ce:web:coverage
      - run: npm run test:ce:e2e
      - run: npm audit --audit-level=high
      - run: docker build -f apps/clearideas-ce/Dockerfile -t clearideas-ce:ci .
