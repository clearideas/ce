services:
  clearideas-ce:
    build:
      context: .
      dockerfile: apps/clearideas-ce/Dockerfile
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4100
      CLEARIDEAS_TRUST_PROXY: ${CLEARIDEAS_TRUST_PROXY:-}
      APP_URL: ${APP_URL:-https://localhost:4100}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-dev-only-change-me}
      FILE_ACCESS_TOKEN_SECRET: ${FILE_ACCESS_TOKEN_SECRET:-}
      HTTPS_REQUIRED: ${HTTPS_REQUIRED:-true}
      MONGODB_URI: ${MONGODB_URI:-}
      MONGODB_HOST: ${MONGODB_HOST:-}
      MONGODB_DATABASE_NAME: ${MONGODB_DATABASE_NAME:-clearideas_ce}
      MONGODB_AUTH_MECHANISM: ${MONGODB_AUTH_MECHANISM:-}
      MONGODB_USERNAME: ${MONGODB_USERNAME:-}
      MONGODB_PASSWORD: ${MONGODB_PASSWORD:-}
      MONGODB_CERTIFICATE_BASE64: ${MONGODB_CERTIFICATE_BASE64:-}
      FIRST_USER_EMAIL: ${FIRST_USER_EMAIL:-admin@example.com}
      FIRST_USER_NAME: ${FIRST_USER_NAME:-Clear Ideas Admin}
      STORAGE_ROOT: apps/clearideas-ce/data/storage
      SEARCH_INDEX_ROOT: apps/clearideas-ce/data/search
      EMAIL_PROVIDER: smtp
      EMAIL_FROM: ${EMAIL_FROM:-Clear Ideas <noreply@clearideas.local>}
      EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      NOTIFICATIONS_ENABLED: "true"
      NOTIFICATION_POLL_INTERVAL_MS: ${NOTIFICATION_POLL_INTERVAL_MS:-60000}
      CLEARIDEAS_DOCS_ENABLED: ${CLEARIDEAS_DOCS_ENABLED:-true}
      CLEARIDEAS_API_RATE_LIMIT_WINDOW_MS: ${CLEARIDEAS_API_RATE_LIMIT_WINDOW_MS:-900000}
      CLEARIDEAS_API_RATE_LIMIT_LIMIT: ${CLEARIDEAS_API_RATE_LIMIT_LIMIT:-600}
      CLEARIDEAS_AUTH_RATE_LIMIT_WINDOW_MS: ${CLEARIDEAS_AUTH_RATE_LIMIT_WINDOW_MS:-900000}
      CLEARIDEAS_AUTH_RATE_LIMIT_LIMIT: ${CLEARIDEAS_AUTH_RATE_LIMIT_LIMIT:-60}
      CLEARIDEAS_SPA_RATE_LIMIT_WINDOW_MS: ${CLEARIDEAS_SPA_RATE_LIMIT_WINDOW_MS:-300000}
      CLEARIDEAS_SPA_RATE_LIMIT_LIMIT: ${CLEARIDEAS_SPA_RATE_LIMIT_LIMIT:-300}
      CLEARIDEAS_CORE_RATE_LIMIT_WINDOW_MS: ${CLEARIDEAS_CORE_RATE_LIMIT_WINDOW_MS:-900000}
      CLEARIDEAS_CORE_RATE_LIMIT_LIMIT: ${CLEARIDEAS_CORE_RATE_LIMIT_LIMIT:-600}
      CLEARIDEAS_CHAT_RATE_LIMIT_WINDOW_MS: ${CLEARIDEAS_CHAT_RATE_LIMIT_WINDOW_MS:-900000}
      CLEARIDEAS_CHAT_RATE_LIMIT_LIMIT: ${CLEARIDEAS_CHAT_RATE_LIMIT_LIMIT:-120}
      CLEARIDEAS_ANALYTICS_RATE_LIMIT_WINDOW_MS: ${CLEARIDEAS_ANALYTICS_RATE_LIMIT_WINDOW_MS:-900000}
      CLEARIDEAS_ANALYTICS_RATE_LIMIT_LIMIT: ${CLEARIDEAS_ANALYTICS_RATE_LIMIT_LIMIT:-300}
      CLEARIDEAS_ACTIVITY_RATE_LIMIT_WINDOW_MS: ${CLEARIDEAS_ACTIVITY_RATE_LIMIT_WINDOW_MS:-900000}
      CLEARIDEAS_ACTIVITY_RATE_LIMIT_LIMIT: ${CLEARIDEAS_ACTIVITY_RATE_LIMIT_LIMIT:-600}
      AUTH_CODE_LENGTH: ${AUTH_CODE_LENGTH:-6}
      AUTH_CODE_EXPIRES_IN: ${AUTH_CODE_EXPIRES_IN:-600}
      AUTH_CODE_ALLOWED_ATTEMPTS: ${AUTH_CODE_ALLOWED_ATTEMPTS:-5}
      SEARCH_INDEX_IDLE_MS: ${SEARCH_INDEX_IDLE_MS:-300000}
      SEARCH_INDEX_MAX_LOADED_SITES: ${SEARCH_INDEX_MAX_LOADED_SITES:-25}
      UPLOAD_SIGNING_SECRET: ${UPLOAD_SIGNING_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      AI_CHAT_MODEL: ${AI_CHAT_MODEL:-}
      AI_CHAT_MODELS: ${AI_CHAT_MODELS:-}
      CHAT_MODEL: ${CHAT_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - clearideas_storage:/usr/src/app/apps/clearideas-ce/data/storage
      - clearideas_search:/usr/src/app/apps/clearideas-ce/data/search
    command: >
      sh -c "node apps/clearideas-ce/dist/scripts/bootstrap.js &&
             node apps/clearideas-ce/dist/server.js"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${CLEARIDEAS_CE_HOST_PORT:-4100}:${CLEARIDEAS_CE_HOST_PORT:-4100}"
    environment:
      CADDY_SITE: ${CADDY_SITE:-https://localhost:4100}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      clearideas-ce:
        condition: service_started
volumes:
  caddy_data:
  caddy_config:
  clearideas_storage:
  clearideas_search:
